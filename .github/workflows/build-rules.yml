name: Build Rules

on:
  push:
    branches:
      - main
    paths:
      - "source/*.list"
      - "scripts/**"
      - ".github/workflows/build-rules.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # Checkout
      # =========================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # Setup Python
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # =========================
      # Install sing-box
      # =========================
      - name: Install sing-box
        shell: bash
        run: |
          set -e

          VERSION=$(curl -fsSL \
            https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | jq -r '.tag_name')

          VERSION="${VERSION#v}"

          echo "Installing sing-box ${VERSION}"

          wget -q \
            "https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz" \
            -O sing-box.tar.gz

          tar -xzf sing-box.tar.gz

          sudo install \
            "sing-box-${VERSION}-linux-amd64/sing-box" \
            /usr/local/bin/sing-box

          sing-box version

      # =========================
      # Install Mihomo
      # =========================
      - name: Install Mihomo
        shell: bash
        run: |
          set -e

          VERSION=$(curl -fsSL \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '.tag_name')

          VERSION="${VERSION#v}"

          echo "Installing Mihomo ${VERSION}"

          URL="https://github.com/MetaCubeX/mihomo/releases/download/v${VERSION}/mihomo-linux-amd64-compatible-${VERSION}.gz"

          wget -q \
            "$URL" \
            -O mihomo.gz

          gunzip mihomo.gz

          chmod +x mihomo

          sudo install mihomo /usr/local/bin/mihomo

          mihomo version

      # =========================
      # Build
      # =========================
      - name: Build rules
        run: |
          python3 scripts/build.py

      # =========================
      # Show generated files
      # =========================
      - name: Show generated files
        run: |
          echo "===== MRS ====="
          ls -lh mrs/ || true

          echo
          echo "===== SRS ====="
          ls -lh srs/ || true

      # =========================
      # Commit
      # =========================
      - name: Commit generated rules
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mrs srs

          if git diff --cached --quiet; then
            echo "No generated rule changes."
            exit 0
          fi

          git commit -m "build: update rules"
          git push
