name: Build Rules

on:
  push:
    branches:
      - main
    paths:
      - "source/*.list"
      - "scripts/**"
      - ".github/workflows/build-rules.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # Checkout
      # =========================
      - name: Checkout
        uses: actions/checkout@v5

      # =========================
      # Setup Python
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # =========================
      # Install sing-box
      # =========================
      - name: Install sing-box
        shell: bash
        run: |
          set -e

          echo "Getting latest sing-box release..."

          API="https://api.github.com/repos/SagerNet/sing-box/releases/latest"

          VERSION=$(curl -fsSL "$API" | jq -r '.tag_name')
          VERSION="${VERSION#v}"

          echo "sing-box version: ${VERSION}"

          URL=$(curl -fsSL "$API" |
            jq -r --arg VERSION "$VERSION" '
              .assets[]
              | select(.name == ("sing-box-" + $VERSION + "-linux-amd64.tar.gz"))
              | .browser_download_url
            ')

          if [ -z "$URL" ]; then
            echo "ERROR: sing-box download URL not found"
            exit 1
          fi

          echo "Download: $URL"

          wget -q "$URL" -O sing-box.tar.gz

          tar -xzf sing-box.tar.gz

          sudo install \
            "sing-box-${VERSION}-linux-amd64/sing-box" \
            /usr/local/bin/sing-box

          sing-box version

      # =========================
      # Install Mihomo
      # =========================
      - name: Install Mihomo
        shell: bash
        run: |
          set -euxo pipefail

          API="https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"

          echo "Getting latest Mihomo release..."

          VERSION=$(curl -fsSL "$API" | jq -r '.tag_name')
          VERSION="${VERSION#v}"

          echo "Mihomo version: ${VERSION}"

          FILE="mihomo-linux-amd64-compatible-v${VERSION}.gz"

          URL="https://github.com/MetaCubeX/mihomo/releases/download/v${VERSION}/${FILE}"

          echo "Download URL:"
          echo "$URL"

          curl -fL \
            "$URL" \
            -o mihomo.gz

          gunzip mihomo.gz

          chmod +x mihomo

          sudo install mihomo /usr/local/bin/mihomo

          echo "Mihomo installed:"
          mihomo version

      # =========================
      # Build rules
      # =========================
      - name: Build rules
        run: |
          python3 scripts/build.py

      # =========================
      # Show generated files
      # =========================
      - name: Show generated files
        run: |
          echo "========================================"
          echo "MRS"
          echo "========================================"
          ls -lh mrs/ || true

          echo
          echo "========================================"
          echo "SRS"
          echo "========================================"
          ls -lh srs/ || true

      # =========================
      # Commit generated rules
      # =========================
      - name: Commit generated rules
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mrs srs

          if git diff --cached --quiet; then
            echo "No generated rule changes."
            exit 0
          fi

          git commit -m "build: update rules"
          git push
